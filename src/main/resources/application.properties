spring.application.name=roms-backend

# BE-007 menu image hosting. Credentials are supplied by the deployment environment.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Import optional .env file if present
spring.config.import=optional:file:.env[.properties]

# Datasource configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/roms_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Server & CORS
server.port=${SERVER_PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

# JWT & Authentication Contracts
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
app.jwt.refresh-token-tablet-expiration-days=90
app.jwt.refresh-token-staff-expiration-days=7
app.jwt.cookie-name=refreshToken
app.jwt.cookie-path=/api/auth
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
app.jwt.cookie-same-site=Lax

# Redis Configuration (OTP and Gemini Menu Context only)
spring.data.redis.timeout=2000ms

# App Redis specific properties
app.redis.otp-ttl-seconds=${REDIS_OTP_TTL_SECONDS:600}
app.redis.otp-max-attempts=${REDIS_OTP_MAX_ATTEMPTS:5}
app.redis.menu-context-ttl-seconds=${REDIS_MENU_CONTEXT_TTL_SECONDS:86400}

# Actuator Redis Health Indicator (disabled by default so local dev without live Redis stays healthy)
management.health.redis.enabled=false

# Google Gemini API Integration
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
app.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}
