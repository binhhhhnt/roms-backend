spring.application.name=roms-backend

# Import optional .env file if present
spring.config.import=optional:file:.env[.properties]

# Datasource configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/roms_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Server & CORS
server.port=${SERVER_PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# JWT & Authentication Contracts
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
app.jwt.refresh-token-tablet-expiration-days=90
app.jwt.refresh-token-staff-expiration-days=7
app.jwt.cookie-name=refreshToken
app.jwt.cookie-path=/api/auth
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
app.jwt.cookie-same-site=Lax

# Redis Configuration (OTP and Gemini Menu Context only)
spring.data.redis.timeout=2000ms

# App Redis specific properties (OTP TTL: 5 minutes / 300 seconds as approved in docs)
app.redis.otp-ttl-seconds=${REDIS_OTP_TTL_SECONDS:300}
app.redis.otp-max-attempts=${REDIS_OTP_MAX_ATTEMPTS:5}
app.redis.menu-context-ttl-seconds=${REDIS_MENU_CONTEXT_TTL_SECONDS:86400}

# Password-Recovery Email (Gmail SMTP via JavaMailSender)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Actuator Redis Health Indicator (disabled by default so local dev without live Redis stays healthy)
management.health.redis.enabled=false

# Google Gemini API Integration
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
app.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}
